[package]
name = "nightowl"
version = "0.3.1"
description = "NightOwl — Tauri desktop app for testing DICOM services"
authors = ["Aurabox"]
edition = "2021"
rust-version = "1.77"

# The library crate exposes `run()` for both the desktop binary (main.rs)
# and any future mobile entrypoints. Keep main.rs thin per CLAUDE.md.
[lib]
name = "nightowl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

# Tokio runtime (Tauri pulls in tokio already; we use spawn directly for
# the background rescan task).
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "sync"] }

# DICOM parsing (M2). The umbrella `dicom` crate re-exports the
# submodules we use directly.
dicom-object = "0.9"
dicom-core = "0.9"
dicom-dictionary-std = "0.9"
dicom-encoding = "0.9"

# DICOM upper layer / DIMSE (M3 onwards). `dicom-ul` carries the
# PDU codec and the association negotiation primitives.
dicom-ul = "0.9"
dicom-transfer-syntax-registry = "0.9"

# SOP Instance index (M2).
rusqlite = { version = "0.39", features = ["bundled"] }

# Directory walker for the rescan (M2).
walkdir = "2.5"

# Structured logging (used across milestones).
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# UUIDs for per-association identifiers in the activity stream.
uuid = { version = "1.23", features = ["v4", "serde"] }

# Platform config directory lookup. The desktop binary gets paths from
# Tauri's AppHandle; the CLI binary uses this crate to resolve the same
# location without depending on Tauri.
directories = "5"

# Wall-clock timestamps for the activity stream.
chrono = { version = "0.4", features = ["serde"] }

# Local MCP server (M24). `rmcp` is the official Model Context Protocol
# Rust SDK. We host a Streamable HTTP MCP service on 127.0.0.1 from
# inside the existing Tauri tokio runtime so external LLM clients can
# drive NightOwl's read + active SCU surface as MCP tools. `axum` and
# `tower` provide the HTTP server the rmcp StreamableHttpService nests
# into. `schemars` produces the JSON schemas that rmcp's `#[tool]` macro
# exposes for each tool's input shape.
rmcp = { version = "1.7", features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
axum = "0.8"
tower = "0.5"
schemars = "1.2"

[dev-dependencies]
reqwest = { version = "0.13.3", default-features = false, features = ["json"] }
# `tempfile` is used by activity-log unit tests to give each test an
# isolated SQLite file even under cargo's parallel test execution.
tempfile = "3"
