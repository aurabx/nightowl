[package]
name = "nightowl-cli"
version = "0.3.1"
edition = "2021"
rust-version = "1.77"
description = "Command-line driver for NightOwl, mirroring the MCP tool surface."
authors = ["Aurabox"]

# Standalone crate so the binary is not pulled into the Tauri `.app`
# bundle alongside the desktop app. Tauri 2's macOS bundler copies
# every `[[bin]]` from the package it builds into
# `Contents/MacOS/`, which broke codesign on x86_64 when the CLI lived
# inside `src-tauri` (the extra unsigned subcomponent caused
# `codesign` to refuse to sign the parent binary on Intel runners).
#
# The command surface itself now lives in `nightowl_lib::cli`, shared
# with the desktop binary (which doubles as the CLI when invoked under
# the `nightowl-cli` symlink the app installs). This crate is a thin
# shim that forwards to `nightowl_lib::cli::run` — it exists for the
# Windows console-subsystem case and for `cargo run -p nightowl-cli`.

[[bin]]
name = "nightowl-cli"
path = "src/main.rs"

[dependencies]
# The CLI surface (argument parsing, dispatch, output formatting) lives
# in the library; this shim only forwards `argv` to `cli::run`, so the
# library path dependency is the only thing it needs.
nightowl = { path = "../src-tauri" }

[dev-dependencies]
# End-to-end tests for the `nightowl-cli` binary. `assert_cmd` builds
# and invokes the binary by name; `tempfile` gives each test its own
# isolated data directory so they cannot collide with the live one;
# `serde_json` parses the `--json` output the tests assert against.
assert_cmd = "2"
tempfile = "3"
serde_json = "1.0"
